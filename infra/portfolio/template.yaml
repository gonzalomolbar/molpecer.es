AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  molpecer.es portfolio: the bucket, its public-read policy and the
  CloudFront distribution. The certificate and Route 53 are managed outside.

Parameters:
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:767105089665:certificate/f37c4985-7607-429b-b80b-842c3b54f564
    Description: ACM certificate (us-east-1) for molpecer.es and *.molpecer.es, managed outside this stack.

Resources:
  PortfolioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: molpecer.es
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  PortfolioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref PortfolioBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${PortfolioBucket}/*"

  Distribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Comment: Distribution for molpecer.es
        Enabled: true
        Aliases:
          - molpecer.es
          - www.molpecer.es
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        Origins:
          - Id: S3-molpecer.es
            DomainName: !Sub "${PortfolioBucket}.s3-website-us-east-1.amazonaws.com"
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: S3-molpecer.es
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # managed SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirect.FunctionARN
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000

  # www.molpecer.es -> molpecer.es, same path and query string.
  WwwRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: molpecer-portfolio-www-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www.molpecer.es to molpecer.es
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host !== 'www.molpecer.es') {
            return request;
          }
          var qs = '';
          for (var key in request.querystring) {
            var entry = request.querystring[key];
            var values = entry.multiValue ? entry.multiValue.map(function (v) { return v.value; }) : [entry.value];
            for (var i = 0; i < values.length; i++) {
              qs += (qs ? '&' : '?') + encodeURIComponent(key) + '=' + encodeURIComponent(values[i]);
            }
          }
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: 'https://molpecer.es' + request.uri + qs } }
          };
        }

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionArn:
    Value: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  PortfolioBucketName:
    Value: !Ref PortfolioBucket
  PortfolioWebsiteEndpoint:
    Value: !GetAtt PortfolioBucket.WebsiteURL
