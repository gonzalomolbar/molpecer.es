AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Calendar 2026 companion site: its own CloudFront distribution with an edge
  gate, one data bucket, one web bucket, one table and three functions.
  Independent of the portfolio stack.

Parameters:
  DomainName:
    Type: String
    Default: calendar-2026.toribios.molpecer.es
  HostedZoneId:
    Type: String
    Default: Z0539383IHVUAXRRCIKD
    Description: The molpecer.es zone; the stack writes only its own records there.
  NotifyEmail:
    Type: String
    Default: gonzalomolbar@gmail.com
  SenderEmail:
    Type: String
    Default: calendar+2026@molpecer.es
  SenderDomain:
    Type: String
    Default: molpecer.es
    Description: Mail identity owned by the molpecer-domain stack.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: ../../calendar-2026/src/
    PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/calendar-2026-boundary
    Environment:
      Variables:
        TABLE: calendar-2026
        DATA_BUCKET: !Sub calendar-2026-data-${AWS::AccountId}
        DOMAIN: !Ref DomainName
        NOTIFY_EMAIL: !Ref NotifyEmail
        SENDER_EMAIL: !Ref SenderEmail
        PARAM_PREFIX: /calendar-2026
        # limits
        PER_NET_POSTS_DAY: "50"
        PER_NET_BYTES_DAY: "524288000"
        PER_NET_UNLOCKS_DAY: "50"
        GLOBAL_POSTS_DAY: "150"
        GLOBAL_UNLOCKS_DAY: "2000"
        GLOBAL_LOGIN_FAILS_HOUR: "100"
        MAX_UPLOAD_BYTES: "10485760"
        MAX_TEXT_CHARS: "1000"
        MAX_NAME_CHARS: "60"

Resources:
  # ---------- certificate and DNS (validation record written by CloudFormation) ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  AliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  AliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  # ---------- the owner's inbox, verified for the SES sandbox; the domain identity lives in molpecer-domain ----------
  RecipientIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref NotifyEmail

  # ---------- storage ----------
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub calendar-2026-data-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      LifecycleConfiguration:
        Rules:
          - { Id: expire-raw-uploads, Status: Enabled, Prefix: raw/, ExpirationInDays: 1 }
          - { Id: abort-multipart, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 } }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Sub "https://${DomainName}"]
            AllowedMethods: [POST, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub calendar-2026-web-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: [s3:GetObject, s3:ListBucket]
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: calendar-2026
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput: { MaxReadRequestUnits: 25, MaxWriteRequestUnits: 25 }
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  # ---------- edge ----------
  KeyValueStore:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: calendar-2026
      Comment: "keys: mode (open|paused|closed), secret (visitor cookie HMAC key)"

  EdgeFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: calendar-2026-gate
      AutoPublish: true
      FunctionConfig:
        Comment: path allow-list, site mode, month time lock, signed visitor cookie
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !GetAtt KeyValueStore.Arn
      FunctionCode: __EDGE_FUNCTION_JS__  # inlined from edge/function.js by tools/render.py

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: calendar-2026-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: calendar-2026-api
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  PageHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: calendar-2026-pages
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              img-src 'self' data: blob: https://calendar-2026-data-${AWS::AccountId}.s3.us-east-1.amazonaws.com https://calendar-2026-data-${AWS::AccountId}.s3.amazonaws.com;
              script-src 'self';
              frame-src 'none';
              style-src 'self' 'unsafe-inline';
              connect-src 'self' https://calendar-2026-data-${AWS::AccountId}.s3.us-east-1.amazonaws.com https://calendar-2026-data-${AWS::AccountId}.s3.amazonaws.com;
              base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Calendar 2026
        Enabled: true
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt ApiOac.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # managed CachingOptimized
          ResponseHeadersPolicyId: !Ref PageHeadersPolicy
          FunctionAssociations:
            - { EventType: viewer-request, FunctionARN: !GetAtt EdgeFunction.FunctionARN }
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # managed CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # managed AllViewerExceptHostHeader
            FunctionAssociations:
              - { EventType: viewer-request, FunctionARN: !GetAtt EdgeFunction.FunctionARN }
        CustomErrorResponses:
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 0 }

  # ---------- functions ----------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: calendar-2026-api
      Handler: api.app.handler
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 5
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan, dynamodb:ConditionCheckItem]
              Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/calendar-2026
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub arn:aws:s3:::calendar-2026-data-${AWS::AccountId}/*
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/calendar-2026/*
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${NotifyEmail}

  ApiInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: calendar-2026-processor
      Handler: processor.app.handler
      MemorySize: 1024
      Timeout: 60
      ReservedConcurrentExecutions: 2
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 3600
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket: !Ref DataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules: [{ Name: prefix, Value: raw/ }]
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/calendar-2026
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub arn:aws:s3:::calendar-2026-data-${AWS::AccountId}/*
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${NotifyEmail}

  BreakerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: calendar-2026-breaker
      Handler: breaker.app.handler
      MemorySize: 128
      Timeout: 30
      Events:
        Alert:
          Type: SNS
          Properties: { Topic: !Ref AlertsTopic }
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:PutFunctionConcurrency
              Resource:
                - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:calendar-2026-api
                - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:calendar-2026-processor

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties: { TopicName: calendar-2026-alerts }

  AlertsEmail:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref NotifyEmail

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/calendar-2026-api, RetentionInDays: 14 }
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/calendar-2026-processor, RetentionInDays: 14 }
  BreakerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/calendar-2026-breaker, RetentionInDays: 14 }

  # ---------- alarms: every one emails; the two cost alarms also trip the breaker ----------
  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: calendar-2026-api-throttles
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: calendar-2026-api }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
  ApiFloodAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: calendar-2026-api-flood
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: calendar-2026-api }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
  ProcessorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: calendar-2026-processor-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: calendar-2026-processor }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
  RequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: calendar-2026-requests
      Namespace: AWS/CloudFront
      MetricName: Requests
      Dimensions:
        - { Name: DistributionId, Value: !Ref Distribution }
        - { Name: Region, Value: Global }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1000000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
  EgressAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: calendar-2026-egress
      Namespace: AWS/CloudFront
      MetricName: BytesDownloaded
      Dimensions:
        - { Name: DistributionId, Value: !Ref Distribution }
        - { Name: Region, Value: Global }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 21474836480
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  SiteUrl:
    Value: !Sub https://${DomainName}/
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  DataBucketName:
    Value: !Ref DataBucket
  KeyValueStoreArn:
    Value: !GetAtt KeyValueStore.Arn
  KeyValueStoreId:
    Value: !GetAtt KeyValueStore.Id
