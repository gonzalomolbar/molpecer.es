name: Calendar 2026 infra

# The stack: template, edge function, Lambda code. Pull requests: tests, lint and a change set shown
# in the job summary (read-only role). Push to main: the same, then execute under the Environment.

on:
  pull_request:
    paths:
      - "infra/calendar-2026/**"
      - "calendar-2026/edge/**"
      - "calendar-2026/src/**"
      - "calendar-2026/tests/**"
      - "calendar-2026/tools/render.py"
      - ".github/workflows/calendar-2026-infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/calendar-2026/**"
      - "calendar-2026/edge/**"
      - "calendar-2026/src/**"
      - "calendar-2026/tests/**"
      - "calendar-2026/tools/render.py"
      - ".github/workflows/calendar-2026-infra.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: calendar-2026-infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK: calendar-2026
  CHANGE_SET: run-${{ github.run_id }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node calendar-2026/tests/edge.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: calendar-2026/src/requirements.txt
      - run: pip install -r calendar-2026/src/requirements.txt -r calendar-2026/tests/requirements.txt
      - run: python -m pytest calendar-2026/tests -q
      - run: python calendar-2026/tools/render.py
      - run: pipx run cfn-lint calendar-2026/.build/template.yaml

  # Build, package and create the change set with a role that cannot execute it.
  plan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CALENDAR_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Refuse to plan while the site is not open
        run: |
          kvs="$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='KeyValueStoreArn'].OutputValue" --output text 2>/dev/null || true)"
          if [ -n "$kvs" ] && [ "$kvs" != "None" ]; then
            mode="$(aws cloudfront-keyvaluestore get-key --kvs-arn "$kvs" --key mode --query Value --output text 2>/dev/null || echo unset)"
            echo "mode=$mode"
            if [ "$mode" != "open" ] && [ "$mode" != "unset" ]; then
              echo "::error::site mode is '$mode'; a deploy would reset the kill switch. Run calendar-2026/tools/switch.sh open first."; exit 1
            fi
          fi
      - name: Build and package
        run: |
          python calendar-2026/tools/render.py
          sam build --template-file calendar-2026/.build/template.yaml --build-dir calendar-2026/.build/out
          sam package --template-file calendar-2026/.build/out/template.yaml \
            --s3-bucket "calendar-2026-artifacts-${{ vars.AWS_ACCOUNT_ID }}" --s3-prefix sam \
            --output-template-file calendar-2026/.build/packaged.yaml
      - name: Create change set
        id: plan
        run: |
          aws cloudformation create-change-set --stack-name "$STACK" --change-set-name "$CHANGE_SET" --change-set-type UPDATE \
            --template-body file://calendar-2026/.build/packaged.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND > /dev/null
          aws cloudformation wait change-set-create-complete --stack-name "$STACK" --change-set-name "$CHANGE_SET" 2>/dev/null || true
          desc="$(aws cloudformation describe-change-set --stack-name "$STACK" --change-set-name "$CHANGE_SET")"
          if [ "$(jq -r .Status <<<"$desc")" = FAILED ]; then
            reason="$(jq -r .StatusReason <<<"$desc")"
            case "$reason" in
              *"didn't contain changes"*|*"No updates are to be performed"*)
                echo "no changes" | tee -a "$GITHUB_STEP_SUMMARY"; echo "empty=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *) echo "change set failed: $reason"; exit 1 ;;
            esac
          fi
          { echo '```'
            jq -r '.Changes[].ResourceChange | "\(.Action)\t\(.LogicalResourceId)\t\(.ResourceType)\treplacement=\(.Replacement // "n/a")"' <<<"$desc"
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          if jq -e '[.Changes[].ResourceChange | select(.Replacement == "True" and (.LogicalResourceId | IN("DataBucket","WebBucket","Table","Distribution","KeyValueStore")))] | length > 0' <<<"$desc" > /dev/null; then
            echo "::error::a stateful resource would be replaced; refusing"; exit 1
          fi
      - name: Drop the change set (pull request)
        if: github.event_name == 'pull_request' && always()
        run: aws cloudformation delete-change-set --stack-name "$STACK" --change-set-name "$CHANGE_SET" || true

  apply:
    if: github.event_name == 'push' && needs.plan.outputs.empty != 'true'
    needs: plan
    runs-on: ubuntu-latest
    environment: calendar-2026-infra
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: |
          aws cloudformation execute-change-set --stack-name "$STACK" --change-set-name "$CHANGE_SET"
          aws cloudformation wait stack-update-complete --stack-name "$STACK"
          aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].StackStatus' --output text
          aws cloudformation update-termination-protection --stack-name "$STACK" --enable-termination-protection > /dev/null
