<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Calendar 2026</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/i18n.js" defer></script>
<script src="/assets/app.js" defer></script>
<script src="/assets/submit.js" defer></script>
</head>
<body>
<main>
  <header class="top">
    <h1><a href="/" data-i18n="title">Calendario 2026</a></h1>
    <div class="lang"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
  </header>

  <p class="intro" data-i18n="intro_1"></p>
  <p class="intro"><strong data-i18n="intro_2"></strong></p>
  <p class="intro" data-i18n="intro_3"></p>

  <section class="card" id="form-card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-kind="photo" aria-selected="true" data-i18n="tab_photo">Foto</button>
      <button type="button" role="tab" data-kind="doodle" aria-selected="false" data-i18n="tab_doodle">Dibujo</button>
    </div>

    <div id="pane-photo">
      <label for="photo" data-i18n="photo_pick">Elige o haz una foto</label>
      <input type="file" id="photo" accept="image/*">
      <div class="hint" data-i18n="photo_hint"></div>
      <img id="photo-preview" class="preview hidden" alt="">
    </div>

    <div id="pane-doodle" class="hidden">
      <canvas class="doodle" id="doodle" width="800" height="800"></canvas>
      <div class="row" style="justify-content: space-between; margin-top: 8px">
        <div class="palette" id="palette"></div>
        <button type="button" class="ghost" id="doodle-clear" data-i18n="clear">Borrar</button>
      </div>
      <div class="hint" data-i18n="doodle_hint"></div>
    </div>

    <label for="name" data-i18n="name">Tu nombre (opcional)</label>
    <input type="text" id="name" maxlength="12" autocomplete="name" required>

    <label for="text" id="text-label" data-i18n="text">Un texto (opcional)</label>
    <textarea id="text" maxlength="1000"></textarea>

    <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>

    <button type="button" class="primary" id="send" data-i18n="send">Enviar</button>
    <div class="status" id="status"></div>
  </section>

  <section class="card hidden" id="done-card">
    <p data-i18n="thanks"></p>
    <div class="code" id="code"></div>
    <p class="hint" data-i18n="keep"></p>
    <a href="/months" class="ghost" style="display:inline-block; text-decoration:none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text)" data-i18n="go_months"></a>
    <button type="button" class="primary" id="another" data-i18n="another"></button>
  </section>

  <footer><a href="/months" data-i18n="all_months"></a></footer>
</main>

</body>
</html>
